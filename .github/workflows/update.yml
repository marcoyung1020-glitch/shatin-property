name: 每日更新

on:
  schedule:
    - cron: "0 2,4,6,8,10,12,14 * * *"   # 香港時間 10:00 至 22:00，每 2 小時
  workflow_dispatch:        # 可喺 Actions 頁面手動執行
  workflow_run:             # 香港電腦更新完美聯後，即時重新整合網站
    workflows: ["美聯（香港電腦）"]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 取回資料
        run: python scripts/push_data.py pull
      - name: 收集及整合資料
        if: github.event_name != 'push'
        env:
          TZ: Asia/Hong_Kong
          MIDLAND_FROM_FILE: "1"
        run: bash scripts/update.sh
      - name: 上載資料
        if: github.event_name != 'push'
        run: python scripts/push_data.py push data/first_seen.json site/data/app.json site/data/estates.json site/data/listings_agency.json site/data/market.json site/data/status.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
