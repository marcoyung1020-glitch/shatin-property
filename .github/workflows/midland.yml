name: 美聯（香港電腦）

# GitHub 伺服器被美聯擋，所以呢部分喺你部電腦（self-hosted runner）執行
on:
  schedule:
    - cron: "45 13 * * *"   # 每晚 9:45（香港時間）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: midland
  cancel-in-progress: false

jobs:
  midland:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 讀取美聯放盤
        run: python scripts/collect.py midland
      - name: 儲存
        run: python scripts/push_data.py site/data/midland.json data/midland_first_pub.json
